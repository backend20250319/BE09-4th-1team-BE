version: '3.8'

services:
  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - msa-network

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
      - "8000:8000"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - msa-network

  comment-service:
    build:
      context: ./comment-service
    container_name: comment-service
    ports:
      - "8001:8001"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - msa-network

  consulting-service:
    build:
      context: ./consulting-service
    container_name: consulting-service
    ports:
      - "8002:8002"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - msa-network

  post-service:
    build:
      context: ./post-service
    container_name: post-service
    ports:
      - "8003:8003"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - msa-network

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8004:8004"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
    networks:
      - msa-network

networks:
  msa-network:
    driver: bridge
