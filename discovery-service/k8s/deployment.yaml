apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery
  template:
    metadata:
      labels:
        app: discovery
    spec:
      containers:
        - name: discovery
          image: discovery-service:latest
          imagePullPolicy: Never  # 🔥 이 줄 추가!
          ports:
            - containerPort: 8761
